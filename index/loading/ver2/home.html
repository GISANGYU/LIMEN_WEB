<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIMEN</title>
<!-- 임시 메인(index) 페이지: 로딩 페이지에서 잠금해제하면 여기로 온다. 실제 메인이 정해지면 교체 -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; background: #02030a; }
  body { display: grid; place-items: center; }
  h1 { margin: 0; font: 400 clamp(36px, 6vw, 96px) "Cormorant Garamond", serif; letter-spacing: 0.4em; padding-left: 0.4em;
       color: rgba(226, 234, 246, 0.92); animation: in 1.6s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes in { from { opacity: 0; filter: blur(10px); transform: translateY(12px); } }
</style>
</head>
<body>
<h1>LIMEN</h1>
</body>
</html>
